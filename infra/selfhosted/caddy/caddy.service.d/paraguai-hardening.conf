# ParaguAI — Sprint 36R. Endurecimento do caddy.service.
#
# Drop-in, e não edição da unit do pacote: `apt upgrade` sobrescreveria a
# unit e devolveria silenciosamente as permissões amplas. O drop-in sobrevive.
#
# A unit do pacote entrega o serviço com quase nenhum confinamento:
# NoNewPrivileges=no, ProtectHome=no, RestrictSUIDSGID=no,
# ProtectKernelTunables/Modules=no, LockPersonality=no, RestrictRealtime=no,
# SystemCallArchitectures vazio. Aqui todos são ligados.
#
# Diferente do caso do healthcheck (Sprints 34A/34B), endurecer aqui não
# quebra nada: o Caddy não invoca `sudo` nem nenhum binário setuid, então
# NoNewPrivileges=yes é compatível com as capabilities ambientais — o systemd
# as concede antes do exec, o que NNP não impede.

[Service]
# ── Capabilities ────────────────────────────────────────────────────────
# O pacote concede cap_net_bind_service E cap_net_admin. A primeira é
# necessária: o Caddy roda como `caddy` (uid 996) e precisa abrir 80 e 443,
# portas privilegiadas. A segunda permite reconfigurar a rede do host —
# um reverse proxy não tem uso legítimo para isso. Removida.
#
# A linha vazia zera o valor herdado antes de redefinir; sem ela, o systemd
# somaria ao conjunto do pacote em vez de substituí-lo.
AmbientCapabilities=
AmbientCapabilities=cap_net_bind_service
CapabilityBoundingSet=
CapabilityBoundingSet=cap_net_bind_service

# ── ExecStart sem --environ ─────────────────────────────────────────────
# `--environ` despeja o ambiente inteiro do processo no journal a cada
# start. Hoje não há segredo ali, mas o dia em que houver o vazamento seria
# silencioso e retroativo. Não há motivo para manter.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile

# ── ExecReload removido ─────────────────────────────────────────────────
# `caddy reload` conversa com a instância em execução ATRAVÉS da Admin API,
# desligada no Caddyfile (`admin off`). Manter o ExecReload do pacote
# deixaria `systemctl reload caddy` falhando de forma obscura. Vazio, o
# systemd responde que a unit não suporta reload — que é a verdade.
# Alterações de configuração: `systemctl restart caddy`.
ExecReload=

# ── Sandbox ─────────────────────────────────────────────────────────────
# ProtectSystem=strict deixa TODO o sistema de arquivos somente-leitura.
# /var/lib/caddy precisa ser exceção explícita: é onde vivem a chave da
# conta ACME e os certificados emitidos. Sem esta linha o Caddy sobe e
# falha ao persistir o certificado.
ProtectSystem=strict
ReadWritePaths=/var/lib/caddy
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
NoNewPrivileges=true
RestrictSUIDSGID=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictNamespaces=true
LockPersonality=true
RestrictRealtime=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
